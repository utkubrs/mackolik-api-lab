name: "Maçkolik — gerçek APK emülatör testi"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MACKOLIK_APK_URL: ${{ secrets.MACKOLIK_APK_URL }}
      MACKOLIK_APK_SHA256: ${{ secrets.MACKOLIK_APK_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: APK kaynağı ön kontrolü
        run: |
          if [ -z "$MACKOLIK_APK_URL" ] || [ -z "$MACKOLIK_APK_SHA256" ]; then
            echo "::error::Original APK bundle not connected. Need private HTTPS download URL and SHA256 via Actions secrets."
            exit 2
          fi
      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Orijinal Maçkolik APK'yi Android 15 üzerinde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator_app_smoke.sh
      - name: APK, süreç, çökme ve ekran kanıtlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mackolik-android-boot
          path: |
            out/launch.png
            out/activity.txt
            out/installed_package_paths.txt
            out/apk_bundle_check.json
            out/app_launch_evidence.json
            out/app_pid.txt
            out/package_status.txt
            out/launch_command.txt
            out/crash_markers.txt
          if-no-files-found: warn
          retention-days: 7
