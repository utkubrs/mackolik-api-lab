name: "Alternatif futbol verileri — gerçek bağlantı testi"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alternative_sources.yml'
      - 'scripts/alternative_sources.py'
      - 'tests/test_alternative_sources.py'
  schedule:
    - cron: '35 6 * * *'
permissions:
  contents: write
concurrency:
  group: mackolik-alternatives
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python testleri ve sözdizimi
        run: |
          python3 -m py_compile scripts/alternative_sources.py
          python3 -m unittest discover -s tests -p 'test_alternative_sources.py' -v
      - name: ESPN ve Understat gerçek JSON kontrolü
        run: python3 scripts/alternative_sources.py
      - name: Test raporunu indirilebilir sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternative-football-data-${{ github.run_number }}
          path: out/alternative_sources.json
          if-no-files-found: warn
          retention-days: 14
      - name: Son doğrulanmış sonucu GitHub'da yayımla
        if: success()
        run: |
          mkdir -p data
          cp out/alternative_sources.json data/alternative_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alternative_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test: publish alternative source connectivity"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
