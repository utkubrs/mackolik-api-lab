name: "Alternatif futbol verileri — gerçek bağlantı testi"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alternative_sources.yml'
      - 'scripts/alternative_sources.py'
      - 'tests/test_alternative_sources.py'
  schedule:
    - cron: '35 6 * * *'
permissions:
  contents: write
concurrency:
  group: mackolik-alternatives
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python testleri ve sözdizimi
        run: |
          python3 -m py_compile scripts/alternative_sources.py
          python3 -m unittest discover -s tests -p 'test_alternative_sources.py' -v
          python3 -m py_compile scripts/sync_winks_report.py
          python3 -m unittest discover -s tests -p 'test_sync_winks_report.py' -v
      - name: ESPN ve Understat gerçek JSON kontrolü
        run: python3 scripts/alternative_sources.py
      - name: FTP sunucusunda Harry Winks gerçek PHP testi
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 100 -o out/hosted_winks.json -w '%{http_code}' 'https://duvar.applerehberi.com/mackolik-api-lab/espn_last5.php?league=ita.1&team_id=2925&player_id=202332&format=json')
          echo "Hosted Harry Winks HTTP $status"
          if [ "$status" != "200" ]; then echo 'Expected HTTP 200; refusing to sync' >&2; exit 1; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/hosted_winks.json').read_text())
          print('PHP server verified:',d.get('five_verified'))
          print('Harry Winks last five:',d.get('series'))
          if d.get('player_id')!='202332' or not d.get('five_verified'):
              raise SystemExit('PHP source has no verified last-five result')
          PY
          python3 scripts/sync_winks_report.py --input out/hosted_winks.json --report data/harry_winks_latest.json
      - name: Test raporunu indirilebilir sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternative-football-data-${{ github.run_number }}
          path: |
            out/alternative_sources.json
            out/hosted_winks.json
          if-no-files-found: warn
          retention-days: 14
      - name: Son doğrulanmış sonucu GitHub'da yayımla
        if: success()
        run: |
          mkdir -p data
          cp out/alternative_sources.json data/alternative_latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alternative_latest.json data/harry_winks_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "test: publish alternative source connectivity"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
