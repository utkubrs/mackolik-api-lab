name: "Maçkolik API Bağlantı Testi"
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test türü'
        type: choice
        options: [smoke, matches, search, player, player_matches, match, player_stats, team, active_squad]
        default: smoke
        required: true
      search_term:
        description: 'Futbolcu adı'
        default: 'Harry Winks'
        type: string
      player_id:
        description: 'Oyuncu ID'
        type: string
      match_id:
        description: 'Maç ID'
        type: string
      team_id:
        description: 'Takım ID'
        type: string
      season_id:
        description: 'Sezon ID'
        type: string
      date:
        description: 'YYYY-MM-DD'
        type: string
      verbose:
        description: 'Detaylı log'
        type: boolean
        default: true
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: mackolik-api-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MODE: ${{ inputs.mode || 'smoke' }}
      SEARCH_TERM: ${{ inputs.search_term || 'Harry Winks' }}
      PLAYER_ID: ${{ inputs.player_id || '' }}
      MATCH_ID: ${{ inputs.match_id || '' }}
      TEAM_ID: ${{ inputs.team_id || '' }}
      SEASON_ID: ${{ inputs.season_id || '' }}
      MATCH_DATE: ${{ inputs.date || '' }}
      VERBOSE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Python ve unit testleri
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v
      - name: Canlı API bağlantı ve JSON denemesi
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode "$MODE" --search-term "$SEARCH_TERM" --out out --timeout 15)
          if [[ -n "$PLAYER_ID" ]]; then args+=(--player-id "$PLAYER_ID"); fi
          if [[ -n "$MATCH_ID" ]]; then args+=(--match-id "$MATCH_ID"); fi
          if [[ -n "$TEAM_ID" ]]; then args+=(--team-id "$TEAM_ID"); fi
          if [[ -n "$SEASON_ID" ]]; then args+=(--season-id "$SEASON_ID"); fi
          if [[ -n "$MATCH_DATE" ]]; then args+=(--date "$MATCH_DATE"); fi
          if [[ "$VERBOSE" == 'true' ]]; then args+=(--verbose); fi
          python3 scripts/probe.py "${args[@]}" 2>&1 | tee probe.log
      - name: Türkiye sunucusundan bağımsız PHP testi
        if: always()
        run: |
          python3 scripts/remote_check.py 2>&1 | tee remote.log
      - name: Sonuç dosyalarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mackolik-diagnostics-${{ github.run_number }}
          path: |
            out/diagnostics.json
            out/summary.md
            probe.log
            remote.log
          if-no-files-found: warn
          retention-days: 30

      - name: Sonucu depoda yayımla (son durum + geçmiş)
        if: always()
        env:
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [[ ! -s out/diagnostics.json ]]; then echo 'Tanılama dosyası bulunamadı; yayımlama atlandı.'; exit 0; fi
          mkdir -p data reports
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path("out/diagnostics.json").read_text(encoding="utf-8"))
          entries=[{"mode":x.get("mode"),"status":x.get("http_status"),"outcome":x.get("outcome"),
                    "duration_ms":x.get("duration_ms"),"received_bytes":x.get("received_bytes"),
                    "json":x.get("is_json"),"error":x.get("error"),
                    "schema_paths":x.get("schema_paths",[])[:60]} for x in run.get("results",[])]
          short={"utc_time":run.get("utc_time"),"mode":run.get("mode"),
                 "github_run":os.environ.get("GH_RUN_ID"),"results":entries}
          Path("data/latest.json").write_text(json.dumps(short,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          history=Path("data/history.jsonl")
          old=history.read_text(encoding="utf-8").splitlines() if history.exists() else []
          record={"utc_time":short["utc_time"],"github_run":short["github_run"],
                  "results":[{"mode":x["mode"],"status":x["status"],"outcome":x["outcome"]} for x in entries]}
          history.write_text("\n".join((old+[json.dumps(record,ensure_ascii=False)])[-384:])+"\n",encoding="utf-8")
          u=f"https://github.com/{os.environ.get('GH_REPO')}/actions/runs/{short['github_run']}"
          lines=["# Maçkolik API Lab — Son kontrol", "",
                 "GitHub Actions her 15 dakikada bir testi *planlar*; GitHub yoğunluğunda gecikebilir.",
                 f"**UTC:** {short['utc_time']}  |  **GitHub logları:** [Çalışmayı aç]({u})","",
                 "| Kontrol | HTTP | JSON | Sonuç | Süre |",
                 "|---|---:|---|---|---:|"]
          for item in entries:
            lines.append(f"| {item['mode']} | {item['status'] or '—'} | {'Evet' if item['json'] else 'Hayır'} | {item['outcome']} | {item['duration_ms']} ms |")
          lines+=["","Gerçek JSON örnekleri için ilgili çalışmanın **Artifacts** bölümündeki dosyayı aç.",
                  "Bu tablo gerçek API erişimi doğrulanana kadar 'veri geliyor' iddiası değildir."]
          Path("reports/SON_DURUM.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.jsonl reports/SON_DURUM.md
          if ! git diff --cached --quiet; then
            git commit -m "test: publish API status for run ${{ github.run_number }}"
            git push origin HEAD:main
          else
            echo 'Yeni veri değişikliği bulunmadı.'
          fi
