name: "Maçkolik — Google Play emülatör ön testi"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/play_store_check.yml'
      - 'scripts/play_store_check.sh'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Script sözdizimi
        run: bash -n scripts/play_store_check.sh
      - name: Android için KVM yetkileri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resmî Google Play sistem imajında listelemeyi denetle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/play_store_check.sh
      - name: Kanıtları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mackolik-play-store-listing
          path: |
            out/play_store_evidence.json
            out/play_store.png
            out/play_store_open.txt
            out/focus.txt
          if-no-files-found: warn
          retention-days: 7
